<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2333" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="278" rx="13" fill="none" stroke="#23293B" stroke-width="1"/>

  <!-- terminal top bar -->
  <rect x="0" y="0" width="1200" height="38" rx="14" fill="#0D1220"/>
  <rect x="0" y="24" width="1200" height="14" fill="#0D1220"/>
  <circle cx="26" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="66" cy="19" r="6" fill="#28C840"/>
  <text x="600" y="24" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#5B6478">visitor@0x-karim: ~</text>

  <!-- terminal content -->
  <g font-family="Fira Code, Consolas, monospace">
    <text x="60" y="95" font-size="18" fill="#00F0FF">$ whoami</text>
    <text x="60" y="140" font-size="44" font-weight="700" fill="url(#textGrad)">Karim Hisham</text>

    <text x="60" y="185" font-size="18" fill="#00F0FF">$ role --current</text>
    <text x="60" y="215" font-size="22" fill="#C9D1D9">Front-End Developer · React &amp; Next.js</text>

    <text x="60" y="252" font-size="15" fill="#5B6478">$ status: <tspan fill="#8B5CF6">open_to_work</tspan> &amp; <tspan fill="#8B5CF6">freelance</tspan></text>
  </g>
</svg>
